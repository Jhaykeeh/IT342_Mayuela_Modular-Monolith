spring.application.name=shop

# Supabase Connection Parameters — loaded from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LegacySupply adapter configuration
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=23-1486-900
legacysupply.api-key=${LS_API_KEY:}

# productId -> LegacySupply item mapping (SupplierSku / PackSize)
legacysupply.catalog.P100.sku=NRQ-3766
legacysupply.catalog.P100.pack-size=20
legacysupply.catalog.P200.sku=NRQ-2742
legacysupply.catalog.P200.pack-size=6
legacysupply.catalog.P300.sku=NRQ-7645
legacysupply.catalog.P300.pack-size=10
