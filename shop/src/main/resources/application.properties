spring.application.name=shop

# Supabase Connection Parameters — read from environment variables so that no
# credential is ever committed to the repository:
#   DB_URL      - jdbc url of the pooler, without any embedded credential
#   DB_USER     - the database role, e.g. postgres.<project-ref>
#   DB_PASSWORD - the database password
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LegacySupply adapter configuration
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=23-1486-900
legacysupply.api-key=${LS_API_KEY:}

# productId -> LegacySupply item mapping (SupplierSku / PackSize)
legacysupply.catalog.P100.sku=NRQ-3766
legacysupply.catalog.P100.pack-size=20
legacysupply.catalog.P200.sku=NRQ-2742
legacysupply.catalog.P200.pack-size=6
legacysupply.catalog.P300.sku=NRQ-7645
legacysupply.catalog.P300.pack-size=10

# Scheduling: the channel runs the heartbeat, the feed poller, the stock sweeper,
# the outbox sweeper and the backorder sweep alongside the Lab 3 jobs.
spring.task.scheduling.pool.size=4

# Tiangge channel (Lab 4). Secrets come from environment variables only:
#   TIANGGE_API_KEY   - the Tiangge bearer key. Falls back to LS_API_KEY, which is
#                       the same key LegacySupply accepts.
#   TIANGGE_CLIENT_ID - the student id sent as X-Client-Id (defaults to the
#                       LegacySupply client id, which Tiangge also accepts).
# The starting process must inherit these; an IDE run configuration does not pick
# up variables set in a separate shell, and a missing key looks like a bad one.
channel.base-url=https://legacysupply.onrender.com/tiangge/v1
channel.client-id=${TIANGGE_CLIENT_ID:23-1486-900}
channel.api-key=${TIANGGE_API_KEY:${LS_API_KEY:}}
channel.app-name=shop

# Listings published at start-up: my product id, the marketplace title, and the
# LegacySupply item behind it (the Lab 3 mapping).
channel.listings[0].seller-sku=P100
channel.listings[0].title=Wireless Mouse
channel.listings[0].supplier-sku=NRQ-3766
channel.listings[1].seller-sku=P200
channel.listings[1].title=Mechanical Keyboard
channel.listings[1].supplier-sku=NRQ-2742
channel.listings[2].seller-sku=P300
channel.listings[2].title=USB-C Hub
channel.listings[2].supplier-sku=NRQ-7645
